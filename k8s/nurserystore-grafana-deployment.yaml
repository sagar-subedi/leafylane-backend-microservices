apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: leafylane
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: leafylane-grafana
  name: leafylane-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: leafylane-grafana
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: leafylane-grafana
    spec:
      containers:
        - image: sushilasubedi/leafylane-grafana
          name: leafylane-grafana
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: leafylane-grafana-volume
      hostname: leafylane-grafana
      restartPolicy: Always
      volumes:
        - name: leafylane-grafana-volume
          persistentVolumeClaim:
            claimName: leafylane-grafana-volume
